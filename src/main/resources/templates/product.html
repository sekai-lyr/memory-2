<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新商品 - Sekai</title>
    <link rel="stylesheet" th:href="@{/product.css}">
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div class="pub-box">
    <div class="pub-header">
        <div class="icon">✦</div>
        <h2>发布新商品</h2>
        <p>填写商品信息，上架到 Sekai 商城</p>
    </div>

    <form id="pubForm">
        <div class="form-grid">
            <div class="item full-width">
                <label>商品名称 <span class="required">*</span></label>
                <input type="text" id="name" placeholder="请输入商品名称，例如：iPhone 15 Pro Max" maxlength="100" required>
                <div class="error-msg"></div>
            </div>

            <div class="item full-width">
                <label>商品描述 <span class="required">*</span></label>
                <textarea id="description" rows="3" placeholder="请输入商品描述，突出核心卖点和优势" required></textarea>
                <div class="error-msg"></div>
            </div>

            <div class="item">
                <label>商品价格 <span class="required">*</span></label>
                <input type="number" step="0.01" id="price" placeholder="例如：7999.00" min="0" required>
                <div class="error-msg"></div>
            </div>

            <div class="item">
                <label>库存数量 <span class="required">*</span></label>
                <input type="number" id="stock" placeholder="例如：50" min="0" required>
                <div class="error-msg"></div>
            </div>

            <div class="item full-width">
                <label>商品分类 <span class="required">*</span></label>
                <select id="categorySelect">
                    <option value="">选择分类...</option>
                </select>
                <div id="categoryTags" class="category-tags"></div>
            </div>

            <div class="item full-width">
                <label>商品图片</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="images" class="image-url-input" data-target="images" placeholder="输入图片URL，按回车添加" style="flex:1;">
                    <button type="button" class="btn btn-secondary add-image-btn" data-target="images" style="flex:none;padding:12px 20px;font-size:13px;">添加</button>
                </div>
                <div id="imagePreview" class="image-preview-container"></div>
            </div>

            <div class="item full-width">
                <label>详情图片</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="detail" class="image-url-input" data-target="detail" placeholder="输入详情图片URL，按回车添加" style="flex:1;">
                    <button type="button" class="btn btn-secondary add-image-btn" data-target="detail" style="flex:none;padding:12px 20px;font-size:13px;">添加</button>
                </div>
                <div id="detailPreview" class="image-preview-container"></div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">✦ 发布商品</span>
                </button>
                <button type="button" class="btn btn-secondary" onclick="location.href='/product/list'">
                    ← 查看商品列表
                </button>
            </div>
        </div>
    </form>
</div>

<script th:src="@{/product.js}"></script>
</body>
</html>
