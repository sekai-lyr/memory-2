<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Sekai</title>
    <link rel="stylesheet" th:href="@{/login.css}">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <div class="logo">✦</div>
        <h2 class="title">欢迎回来</h2>
        <p class="subtitle">Sekai 二次元电商平台</p>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label>账号</label>
                <input type="text" id="username" placeholder="请输入用户名/邮箱" required>
            </div>

            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">记住我</label>
            </div>

            <button type="submit" class="login-btn">✦ 立即登录</button>

            <div class="links">
                <a href="">忘记密码？</a>
                <a href="/reg">立即注册 →</a>
            </div>
        </form>
    </div>
</div>
<script th:src="@{/login.js}"></script>
</body>
</html>
