<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sekai 收藏市场，发现动漫与游戏周边。">
    <title>发现收藏品 | Sekai</title>
    <link rel="stylesheet" href="/common.css">
</head>
<body>
<!-- THESIS: 把二次元收藏品当作一张可展开的档案，拒绝泛电商的喧闹货架。 OWN-WORLD: 纸白、墨黑、朱砂红，折痕线和真实商品图组成收藏市场。 STORY: 访客先看到收藏桌面，再按品类或关键词找到物件，进入详情并加入购物车。 FIRST VIEWPORT: 左侧标题、搜索和动作，右侧为生成的收藏桌面图，导航保持单行。 FORM: 折纸展开方向，assigned index 4，seed 0403ecff。 FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance. -->
<div id="siteHeader"></div>

<main class="page">
    <section class="hero-collection">
        <div class="hero-copy" data-intro>
            <div class="page-kicker">Sekai 收藏市场</div>
            <h1>把喜欢的，<em>摆在身边。</em></h1>
            <p>从亚克力立牌到画集，在具体的物件里找到属于你的那一件。</p>
            <div class="button-row hero-actions">
                <a class="button button-primary" href="#catalog">浏览收藏</a>
                <a class="button button-secondary" href="/product/publish">发布商品</a>
            </div>
            <form class="hero-search" id="heroSearch">
                <label class="sr-only" for="searchInput">搜索商品</label>
                <input id="searchInput" type="search" autocomplete="off" placeholder="搜索角色、作品或商品名">
                <button type="submit">搜索</button>
            </form>
        </div>
        <div class="hero-art" data-intro>
            <img src="/assets/hero-collection-desk.png" alt="收藏桌面上的折纸鹤、亚克力立牌和画集">
        </div>
    </section>

    <section class="category-band reveal" aria-labelledby="categoryTitle">
        <div>
            <h2 id="categoryTitle">按收藏习惯找</h2>
            <p>从物件类型开始，找到更接近你书架的一小块。</p>
        </div>
        <div class="category-list" id="categoryList" aria-label="商品分类"></div>
    </section>

    <section id="catalog" class="reveal" aria-labelledby="catalogTitle">
        <h2 id="catalogTitle" class="sr-only">商品目录</h2>
        <div class="market-tools">
            <div class="result-count" id="resultCount">正在整理目录</div>
            <div class="tool-cluster">
                <label class="sr-only" for="sortSelect">排序方式</label>
                <select class="select" id="sortSelect">
                    <option value="default">推荐顺序</option>
                    <option value="price_asc">价格从低到高</option>
                    <option value="price_desc">价格从高到低</option>
                    <option value="stock_desc">库存从多到少</option>
                    <option value="name">名称排序</option>
                </select>
                <div class="view-toggle" aria-label="目录视图">
                    <button type="button" class="active" id="gridViewBtn" aria-label="网格视图">网格</button>
                    <button type="button" id="listViewBtn" aria-label="列表视图">列表</button>
                </div>
            </div>
        </div>
        <div id="productGrid" class="skeleton-grid" aria-live="polite">
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div></div>
        </div>
        <div class="pagination" id="pagination"></div>
    </section>
</main>

<footer><div class="footer-inner"><span>Sekai 收藏市场</span><span>商品图来自本地目录，价格与库存以当前数据为准。</span></div></footer>

<script src="/common.js"></script>
<script>
    const state = { page: 1, pageSize: 24, totalPage: 1, products: [], filtered: [], categories: [], category: '', view: 'grid' };
    const parents = () => state.categories.filter(item => item.parentCategoryId === 0 || item.parentCategoryId == null);
    function categoryById(id) { return state.categories.find(item => Number(item.id) === Number(id)); }
    function topCategoryId(id) { let category = categoryById(id); const seen = new Set(); while (category && category.parentCategoryId && Number(category.parentCategoryId) !== 0 && !seen.has(Number(category.id))) { seen.add(Number(category.id)); category = categoryById(category.parentCategoryId); } return category ? Number(category.id) : Number(id); }
    function categoryIdsForTop(id) { const accepted = new Set([Number(id)]); let changed = true; while (changed) { changed = false; state.categories.forEach(item => { if (item.parentCategoryId != null && accepted.has(Number(item.parentCategoryId)) && !accepted.has(Number(item.id))) { accepted.add(Number(item.id)); changed = true; } }); } return accepted; }

    function parseCategoryIds(value) {
        try { const result = JSON.parse(value || '[]'); return Array.isArray(result) ? result.map(Number) : []; }
        catch (error) { return String(value || '').split(',').map(Number).filter(Boolean); }
    }

    function categoryFor(product) { const ids = parseCategoryIds(product.categoryIds); const category = categoryById(ids.length ? topCategoryId(ids[0]) : 0); return category ? category.name : '收藏品'; }

    function renderCategories() {
        const counts = {};
        state.products.forEach(product => { const topIds = new Set(parseCategoryIds(product.categoryIds).map(topCategoryId)); topIds.forEach(id => { counts[id] = (counts[id] || 0) + 1; }); });
        document.getElementById('categoryList').innerHTML = [
            `<button type="button" class="category-button ${state.category === '' ? 'active' : ''}" data-category="">全部 <small>${state.products.length}</small></button>`,
            ...parents().map(item => `<button type="button" class="category-button ${state.category === String(item.id) ? 'active' : ''}" data-category="${item.id}">${Sekai.esc(item.name)} <small>${counts[item.id] || 0}</small></button>`)
        ].join('');
        Sekai.$$('.category-button').forEach(button => button.addEventListener('click', () => {
            state.category = button.dataset.category;
            state.page = 1;
            renderCategories();
            filterAndRender();
        }));
    }

    function renderCard(product) {
        const image = Sekai.firstImage(product.images);
        const stock = Number(product.stock) || 0;
        const canBuy = stock > 0 && (!Sekai.currentUser || Number(Sekai.currentUser.id) !== Number(product.userId));
        return `<article class="product-card" data-intro>
            <a href="/product/detail?id=${product.id}" aria-label="查看 ${Sekai.esc(product.name || '商品')}">
                <div class="card-media">${image ? `<img src="${Sekai.esc(image)}" alt="${Sekai.esc(product.name || '商品图片')}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-media-fallback>图片暂不可用</div>'">` : '<div class="card-media-fallback">暂无图片</div>'}</div>
            </a>
            <div class="card-body">
                <div class="card-kind">${Sekai.esc(categoryFor(product))}</div>
                <a class="card-title" href="/product/detail?id=${product.id}">${Sekai.esc(product.name || '未命名商品')}</a>
                <p class="card-description">${Sekai.esc(product.description || '这件收藏品正在等待它的下一位收藏者。')}</p>
                <div class="card-footer"><span class="card-price">${Sekai.fmtMoney(product.price)}</span><span class="card-stock">${stock > 0 ? `库存 ${stock}` : '暂时售罄'}</span></div>
                <div class="card-actions">${canBuy ? `<button type="button" class="text-button" onclick="addToCart(${product.id}, event)">加入购物车</button><button type="button" class="text-button" onclick="buyNow(${product.id}, event)">立即购买</button>` : `<span class="card-stock">${stock > 0 ? '你的商品' : '等待补货'}</span>`}</div>
            </div>
        </article>`;
    }

    function filterAndRender() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const sort = document.getElementById('sortSelect').value;
        state.filtered = state.products.filter(product => {
            const name = String(product.name || '').toLowerCase();
            const description = String(product.description || '').toLowerCase();
            const matchesKeyword = !keyword || name.includes(keyword) || description.includes(keyword);
            const matchesCategory = !state.category || parseCategoryIds(product.categoryIds).some(id => categoryIdsForTop(state.category).has(Number(id)));
            return matchesKeyword && matchesCategory;
        });
        if (sort === 'price_asc') state.filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
        if (sort === 'price_desc') state.filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
        if (sort === 'stock_desc') state.filtered.sort((a, b) => Number(b.stock || 0) - Number(a.stock || 0));
        if (sort === 'name') state.filtered.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
        const total = state.filtered.length;
        state.totalPage = Math.max(1, Math.ceil(total / state.pageSize));
        state.page = Math.min(state.page, state.totalPage);
        const start = (state.page - 1) * state.pageSize;
        const visible = state.filtered.slice(start, start + state.pageSize);
        const grid = document.getElementById('productGrid');
        grid.className = `product-grid ${state.view === 'list' ? 'list-view' : ''}`;
        const html = visible.length ? visible.map(renderCard).join('') : `<div class="empty-state"><h3>${keyword || state.category ? '没有找到对应收藏' : '市场还没有商品'}</h3><p>${keyword || state.category ? '换个关键词或分类试试。' : '你可以发布第一件商品，让目录开始生长。'}</p><a class="button button-secondary" href="/product/publish">发布商品</a></div>`;
        Sekai.replaceHTMLWithMotion(grid, html, { duration: 560, stagger: 45 });
        document.getElementById('resultCount').innerHTML = `找到 <strong>${total}</strong> 件收藏品`;
        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination');
        if (state.totalPage <= 1) { container.innerHTML = state.filtered.length ? '<span class="page-note">目录已全部展开</span>' : ''; return; }
        const buttons = [`<button class="page-button" type="button" ${state.page === 1 ? 'disabled' : ''} onclick="goPage(${state.page - 1})">上一页</button>`];
        for (let page = 1; page <= state.totalPage; page += 1) {
            if (page === 1 || page === state.totalPage || Math.abs(page - state.page) <= 1) buttons.push(`<button class="page-button ${page === state.page ? 'active' : ''}" type="button" onclick="goPage(${page})">${page}</button>`);
            else if (page === 2 || page === state.totalPage - 1) buttons.push('<span class="page-note">...</span>');
        }
        buttons.push(`<button class="page-button" type="button" ${state.page === state.totalPage ? 'disabled' : ''} onclick="goPage(${state.page + 1})">下一页</button>`);
        container.innerHTML = buttons.join('');
    }

    function goPage(page) { if (page < 1 || page > state.totalPage) return; state.page = page; filterAndRender(); document.getElementById('catalog').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    function setView(view) { state.view = view; document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid'); document.getElementById('listViewBtn').classList.toggle('active', view === 'list'); filterAndRender(); }
    function addToCart(productId, event) { event.stopPropagation(); if (!Sekai.requireLogin()) return; const button = event.currentTarget; button.disabled = true; button.textContent = '加入中'; Sekai.api('/trade/cart/add/api', { method: 'POST', body: { productId, quantity: 1 } }).then(result => { button.disabled = false; button.textContent = '加入购物车'; if (Sekai.isSuccess(result)) { Sekai.toast('已加入购物车', 'success'); Sekai.refreshCartBadge(); } else if (result) Sekai.toast(result.message || '加入失败', 'error'); }); }
    function buyNow(productId, event) { event.stopPropagation(); if (!Sekai.requireLogin()) return; window.location.href = `/product/detail?id=${productId}&buy=1`; }

    async function loadCatalog() {
        const [categoryResponse, productResponse] = await Promise.all([fetch('/category/list/api'), fetch('/product/list/api?pageNum=1&pageSize=999')]);
        const categoryResult = await categoryResponse.json();
        const productResult = await productResponse.json();
        if (!Sekai.isSuccess(categoryResult) || !Sekai.isSuccess(productResult)) throw new Error('目录加载失败');
        state.categories = categoryResult.data || [];
        state.products = productResult.data?.data || [];
        renderCategories();
        filterAndRender();
    }

    document.getElementById('heroSearch').addEventListener('submit', event => { event.preventDefault(); state.page = 1; filterAndRender(); document.getElementById('catalog').scrollIntoView({ behavior: 'smooth' }); });
    document.getElementById('searchInput').addEventListener('input', () => { state.page = 1; filterAndRender(); });
    document.getElementById('sortSelect').addEventListener('change', () => { state.page = 1; filterAndRender(); });
    document.getElementById('gridViewBtn').addEventListener('click', () => setView('grid'));
    document.getElementById('listViewBtn').addEventListener('click', () => setView('list'));
    (async () => { await Sekai.init('market'); try { await loadCatalog(); } catch (error) { document.getElementById('productGrid').innerHTML = '<div class="error-state"><h3>目录暂时没有打开</h3><p>请检查服务和数据库连接后重试。</p><button class="button button-secondary" type="button" onclick="location.reload()">重新加载</button></div>'; document.getElementById('resultCount').textContent = '目录加载失败'; } })();
</script>
</body>
</html>
